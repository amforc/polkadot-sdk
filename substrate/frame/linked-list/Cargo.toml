[package]
name = "pallet-linked-list"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "FRAME linked-list pallet"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { workspace = true, features = ["derive"] }
frame = { workspace = true, features = ["runtime"] }
linked-list-interface = { workspace = true }
scale-info = { workspace = true, features = ["derive"] }

[dev-dependencies]
sp-tracing = { workspace = true, default-features = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame/std",
	"linked-list-interface/std",
	"scale-info/std",
]
runtime-benchmarks = [
	"frame/runtime-benchmarks",
	"linked-list-interface/runtime-benchmarks",
]
try-runtime = [
	"frame/try-runtime",
	"linked-list-interface/try-runtime",
]
